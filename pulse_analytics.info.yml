name: 'Pulse Analytics'
type: module
description: 'Pulse Analytics adds privacy-first web analytics to a Drupal site. It sets no cookies and never stores IP addresses. The script is about 3 KB.'
package: Statistics
# ^10 || ^11 covers both currently-supported core branches (10.6.x and 11.x).
# This module uses only hook_page_attachments() and ConfigFormBase, both stable
# across the range, so there is no reason to require a later 10.x point release.
core_version_requirement: ^10 || ^11
configure: pulse_analytics.settings

################
# Drupal.org GitLab CI.
#
# This is the canonical CI for this module: drupal.org runs it on every merge
# request and on pushes to the default branch, and it is what the contributed
# ecosystem reads. It runs phpcs (Drupal + DrupalPractice), phpstan, eslint,
# stylelint, a composer/YAML lint pass, and PHPUnit — unit, kernel and
# functional — against each supported core version.
#
# 🔑 The core version matrix is the reason this file matters more than a local
# run — but ONLY because the variables block below turns it on. Drupal 10.6 pins
# PHPUnit ^9.6, which cannot read attribute test metadata, while Drupal 11.4 pins
# ^11.5, which deprecates doc-comment metadata.
#
# 🔴 The tests therefore carry DOC-COMMENT `@group` ONLY — no `#[Group]`
# attributes. This comment previously said they carry BOTH; that was wrong, and
# "both" is the option that was measured to FAIL. On Drupal 10 the attribute
# class does not exist, so phpstan reports "Attribute class
# PHPUnit\Framework\Attributes\Group does not exist" and the Drupal 10 job goes
# red — and adding a doc-comment alongside does not make the class exist. Only
# doc-comments are green on both branches, at the cost of a cosmetic deprecation
# notice on 11. `@covers` was dropped for the same reason: no execution meaning,
# most of the notice count.
#
# Revisit when the core floor moves past Drupal 10 (end of life December 2026)
# and switch to attributes then. Reasoning and the measurements: RELEASING.md.
#
# The include is kept verbatim from the template so that upstream changes reach
# this project automatically. See
# https://git.drupalcode.org/project/gitlab_templates/
################

# 🔴 MEASURED 16-09-2026 ON PIPELINE #963131, AND IT CONTRADICTED THIS FILE.
# The include ALONE does not give you what the comment above promises. Two
# defaults in the shared template have to be overridden or the CI is theatre:
#
#   1. Every OPT_IN_TEST_* defaults to '0', so ONLY the current core version
#      runs. There was no matrix — one phpunit job, Drupal 11 only — while
#      pulse_analytics.info.yml claims `^10 || ^11`. We were shipping a Drupal 10
#      claim that CI never exercised, and the LOCAL harness was the only thing
#      testing it. Exactly backwards from what RELEASING.md said.
#   2. phpcs, phpstan, eslint and cspell all ran with allow_failure=true, so
#      FOUR of seven jobs could not fail the pipeline. cspell was RED on the
#      first push and the pipeline still reported `success`.
#
# 🔑 A pipeline's own status is not a statement about its jobs. Read
# allow_failure per job before calling a green pipeline a passing one.
variables:
  # Test the previous major too: we claim ^10 || ^11, so both must run.
  # 🔴 THIS IS A TWO-PART GATE AND ONE HALF IS NOT ENOUGH. Measured on #963155:
  # OPT_IN_TEST_PREVIOUS_MAJOR alone made the Drupal 10 jobs EXIST and then left
  # them `manual`/`skipped` — they appear in the pipeline, they are green-adjacent,
  # and they never ran. _AUTORUN_PREVIOUS_MAJOR defaults to 'none' while
  # _AUTORUN_CURRENT defaults to 'all'; 'all' is copied from the value that is
  # demonstrably running today rather than guessed from the regex.
  OPT_IN_TEST_PREVIOUS_MAJOR: '1'
  _AUTORUN_PREVIOUS_MAJOR: 'all'
  # Make the validate stage able to fail. Without this phpcs and phpstan are
  # decoration — the two checks this module's review discipline leans on hardest.
  _ALL_VALIDATE_ALLOW_FAILURE: '0'
  _CSPELL_ALLOW_FAILURE: '0'

include:
  - project: $_GITLAB_TEMPLATES_REPO
    ref: $_GITLAB_TEMPLATES_REF
    file:
      - '/includes/include.drupalci.main.yml'
      - '/includes/include.drupalci.variables.yml'
      - '/includes/include.drupalci.workflows.yml'

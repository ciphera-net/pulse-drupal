# Not optional in practice. Tests run with $strictConfigSchema = TRUE and throw
# on unschemad config, and since Drupal 10.4 ConfigFormBase::validateForm()
# validates submitted values against typed config — so a missing schema turns
# into a validation error on save, not a quiet omission.
pulse_analytics.settings:
  type: config_object
  label: 'Pulse Analytics settings'
  mapping:
    domain:
      type: string
      label: 'Domain'
    companion:
      type: boolean
      label: 'Record clicks, copies and form submits'
    api:
      type: uri
      label: 'Custom API origin'
    track_admin:
      type: boolean
      label: 'Also track administration pages'
